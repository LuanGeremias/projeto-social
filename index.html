<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Projeto Social</title>
    <style>
        body {
            background-image: url(imagens/fundo-madeira.jpg);    
        }
        
        div#celular {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        div#logos {
            width: 0px;
        }

        .logo{
            width: 50px;
            text-align: end;
            border-radius: 50px;
        }
    </style>
</head>
<body>
    <div id="celular">
        <img src="imagens/frame-iphone.png" alt="Celular">
    </div>
    <div id="logos">
        <img src="imagens/logo-github.jpg" alt="GitHub" class="logo">
        <img src="imagens/logo-instagram.jpg" alt="Instagram" class="logo">
    </div>
</body>
</html>
