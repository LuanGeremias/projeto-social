<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Projeto Social</title>
    <style>
        body {
            background-image: url(imagens/fundo-madeira.jpg);    
        }
        
        div#celular {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        div#logos {
            position: absolute;
            top: 1%;
            left: 90%;
            width: 5px;
        }

        .logo{
            width: 50px;
            border-radius: 50px;
        }
        
        ul{
            list-style-type: none;
            margin: 0px;
            padding: 0px;
        }

        iframe{
            display: block;
            margin: auto;
            
        }
    </style>
</head>
<body>
    <div id="celular">
        <img src="imagens/frame-iphone.png" alt="Celular">
        <iframe src="paginas/pag001.html"></iframe>
    </div>
    <div id="logos">
        <ul>
            <li><a href="#"><img src="imagens/logo-github.jpg" alt="GitHub" class="logo"></a>
            <li><a href="#"><img src="imagens/logo-instagram.jpg" alt="Instagram" class="logo"></a>
        </ul>
    </div>
</body>
</html>
